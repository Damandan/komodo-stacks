[[server]]
name = "Optimus"
[server.config]
enabled = true

##

[[procedure]]
name = "Backup Core Database"
description = "Triggers the Core database backup at the scheduled time."
tags = ["system"]
config.schedule = "Every day at 01:00"

[[procedure.config.stage]]
name = "Stage 1"
enabled = true
executions = [
  { execution.type = "BackupCoreDatabase", execution.params = {}, enabled = true }
]

##

[[procedure]]
name = "Global Auto Update"
description = "Pulls and auto updates Stacks and Deployments using 'poll_for_updates' or 'auto_update'."
tags = ["system"]
config.schedule = "Every day at 03:00"

[[procedure.config.stage]]
name = "Stage 1"
enabled = true
executions = [
  { execution.type = "GlobalAutoUpdate", execution.params.skip_auto_update = false, enabled = true }
]

##

[[procedure]]
name = "Rotate Server Keys"
description = "Rotates all currently connected Server keys."
tags = ["system"]
config.schedule = "Every day at 06:00"

[[procedure.config.stage]]
name = "Stage 1"
enabled = true
executions = [
  { execution.type = "RotateAllServerKeys", execution.params = {}, enabled = true }
]

##

[[builder]]
name = "Optimus"
[builder.config]
type = "Server"
params.servers = ["Optimus"]

[[repo]]
name = "Damandan"
[repo.config]
server = "Optimus"
builder = "Optimus"
git_account = "Damandan"
repo = "Damandan/komodo-stacks"

[[procedure]]
name = "Daily Restarts"
config.schedule = "0 0 18 * * *"
config.schedule_format = "Cron"

[[procedure.config.stage]]
name = "Restart containers"
enabled = true
executions = [
  { execution.type = "RestartContainer", execution.params.server = "Optimus", execution.params.container = "frigate", enabled = true }
]

[[resource_sync]]
name = "Damandan"
[resource_sync.config]
linked_repo = "Damandan"
resource_path = ["komodo_dsm.toml"]
managed = true
delete = true

[[stack]]
name = "combined-containers"
description = "Danny's docker stack"
tags = [
  "downloads",
  "home-automation",
  "movies",
  "series",
  "proxy",
  "media",
  "database",
  "jellyfin"
]
[stack.config]
server = "Optimus"
poll_for_updates = true
auto_update = true
auto_update_all_services = true
linked_repo = "Damandan"
run_directory = "combined"
file_paths = ["compose_dsm.yaml"]