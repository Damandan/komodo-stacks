services:
  adguardhome:
    image: adguard/adguardhome
    container_name: adguardhome
    restart: always
    network_mode: host
    volumes:
      - config:/opt/adguardhome/conf # app configuration
      - work:/opt/adguardhome/work # app working directory
      - ${ADGUARD_CERTIFICATES_PATH}:/etc/certs:ro
        
  redis:
    image: docker.io/library/redis:7
    container_name: paperless-redis
    restart: unless-stopped
    networks:
      - proxy
    deploy:
      resources:
        limits:
          memory: 256M

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless
    restart: unless-stopped
    depends_on:
      - redis
      - db
    networks:
      - proxy
      - mariadb
    volumes:
      - ${PAPERLESS_DATA_PATH}:/usr/src/paperless/data
      - ${PAPERLESS_MEDIA_PATH}:/usr/src/paperless/media
      - ${PAPERLESS_EXPORT_PATH}:/usr/src/paperless/export
      - ${PAPERLESS_CONSUME_PATH}:/usr/src/paperless/consume
    environment:
      - PAPERLESS_REDIS=redis://paperless-redis:6379
      - PAPERLESS_DBHOST=mariadb
      - PAPERLESS_DBPORT=3306
      - PAPERLESS_DBENGINE=mariadb
      - PAPERLESS_DBNAME=${PAPERLESS_DB_NAME}
      - PAPERLESS_DBUSER=${PAPERLESS_DB_USER}
      - PAPERLESS_DBPASS=${PAPERLESS_DB_PWD} # Or a specific user pass
      - PAPERLESS_URL=https://paperless.damandan.nl
      - PAPERLESS_CSRF_TRUSTED_ORIGINS=https://paperless.damandan.nl
      - PAPERLESS_TIME_ZONE=Europe/Amsterdam
      - PAPERLESS_OCR_LANGUAGE=${PAPERLESS_OCR_LANGUAGE}
      - PAPERLESS_OCR_LANGUAGES=${PAPERLESS_OCR_LANGUAGES}
      - PAPERLESS_SECRET_KEY=${PAPERLESS_SECRET_KEY}
      - USER_ID=1000 # Match your preferred PUID
      - GROUP_ID=100  # Match your PGID
      - PAPERLESS_GMAIL_OAUTH_CLIENT_ID=${PAPERLESS_GMAIL_CLIENT}
      - PAPERLESS_GMAIL_OAUTH_CLIENT_SECRET=${PAPERLESS_GMAIL_SECRET}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.paperless.rule=Host(`paperless.damandan.nl`)"
      - "traefik.http.routers.paperless.entrypoints=websecure"
      - "traefik.http.routers.paperless.tls=true"
      - "traefik.http.services.paperless.loadbalancer.server.port=8000"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
  
  glances:
    image: nicolargo/glances:ubuntu-latest-full
    pid: host
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /run/user/1000/podman/podman.sock:/run/user/1000/podman/podman.sock
    environment:
      - "GLANCES_OPT=-w"
    # For nvidia GPUs
    restart: no
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  
  frigate:
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:0.18.0-beta3-tensorrt
    restart: always
    # You currently run privileged; keeping it because it's in your working baseline.
    # If you want to harden later, we can drop privileged and keep only device rules.
    privileged: true
    runtime: nvidia
    shm_size: "1G"
    networks:
      - proxy
    # Explicit device nodes to ensure GPU is available even when Komodo doesn't support device_requests.
    # You already verified these exist and work inside a test container.
    devices:
      # NVIDIA GPU devices
      #- /dev/nvidia0:/dev/nvidia0
      #- /dev/nvidiactl:/dev/nvidiactl
      #- /dev/nvidia-uvm:/dev/nvidia-uvm
      #- /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
      # Your existing USB mapping (Coral / other USB)
      - ${USB_BUS_PATH}:/dev/bus/usb
    # Optional but good hygiene; with privileged=true it's not strictly required,
    # but it makes the intent explicit and helps if you later remove privileged.
    device_cgroup_rules:
      # Your existing USB rule
      - 'c 189:* rmw'
      # NVIDIA device majors (common on Debian)
      - 'c 195:* rmw'   # nvidia0, nvidiactl
      - 'c 237:* rmw'   # nvidia-uvm, nvidia-uvm-tools
      - 'c 240:* rmw'   # /dev/nvidia-caps/* (if present)
    volumes:
      - ${LOCALTIME_PATH}:/etc/localtime:ro
      - ${FRIGATE_CONFIG_PATH}:/config
      - ${FRIGATE_MEDIA_PATH}:/media/frigate
      # --- Critical fix for: "Cannot load libnvcuvid.so.1" ---
      # Bind-mount the host CUVID library into standard linker paths inside the container.
      # Host verified path (ldconfig): /lib/x86_64-linux-gnu/libnvcuvid.so.1
      #- /lib/x86_64-linux-gnu/libnvcuvid.so.1:/lib/x86_64-linux-gnu/libnvcuvid.so.1:ro
      #- /lib/x86_64-linux-gnu/libnvcuvid.so:/lib/x86_64-linux-gnu/libnvcuvid.so:ro
      # Cache tmpfs (your existing setup)
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frigate.rule=Host(`frigate.damandan.nl`)"
      - "traefik.http.routers.frigate.entrypoints=websecure"
      - "traefik.http.routers.frigate.tls=true"
      - "traefik.http.services.frigate.loadbalancer.server.port=8971"

    group_add:
      - "44"  # GID for video group (your existing)
    environment:
      FRIGATE_MQTT_USER: ${FRIGATE_MQTT_USER}
      FRIGATE_MQTT_PASSWORD: ${FRIGATE_MQTT_PASSWORD}
      # Make capabilities explicit; this is the part NVDEC/NVENC needs.
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    cap_add:
      - CAP_PERFMON
  
  traefik:
    image: traefik:v3.6.15
    container_name: traefik
    restart: always
    networks:
      - proxy
      - default
    ports:
      - "80:80"
      - "443:443/tcp"
      - "443:443/udp"
      - "853:853/udp"
    volumes:
      - ${DOCKER_SOCKET_PATH}:/var/run/docker.sock
      - ${TRAEFIK_STATIC_CONFIG_PATH}:/etc/traefik/traefik.yaml:ro
      - ${TRAEFIK_DYNAMIC_CONFIG_PATH}:/etc/traefik/dynamic.yaml:ro
      - ${TRAEFIK_ACME_PATH}:/letsencrypt/acme.json
      - ${TRAEFIK_TRANSIP_PATH}:/transip
    labels:
      - "traefik.enable=false"
    environment:
      - TRANSIP_ACCOUNT_NAME=${TRANSIP_ACCOUNT_NAME}
      - TRANSIP_PRIVATE_KEY_PATH=${TRANSIP_PRIVATE_KEY_PATH}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    stop_signal: SIGTERM
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    depends_on:
      - db
    volumes:
      - ${HOMEASSISTANT_CONFIG_PATH}:/config
      - ${LOCALTIME_PATH}:/etc/localtime:ro
      - ${DBUS_PATH}:/run/dbus:ro
    restart: always
    privileged: true
    security_opt:
      - seccomp=unconfined
    network_mode: host
    devices:
      - /dev/pyBat:/dev/pyBat
    environment:
      TZ: Europe/Amsterdam
    stop_signal: SIGTERM
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 3G

  matter-server:
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    container_name: matter-server
    user: 1000:100
    restart: always
    network_mode: host
    security_opt:
      - apparmor:unconfined
    volumes:
      - ${MATTER_SERVER_DATA_PATH}:/data/
      - ${DBUS_PATH}:/run/dbus:ro
    stop_signal: SIGTERM
    stop_grace_period: 30s

  modbus-proxy:
    image: tiagocoutinho/modbus-proxy
    container_name: modbus-proxy
    restart: always
    ports:
      - "5020:502"
    volumes:
      - ${MODBUS_PROXY_CONFIG_PATH}:/etc/modbus-proxy.yml
    stop_signal: SIGINT
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M
        reservations:
          cpus: '0.05'

  db:
    image: mariadb:latest
    container_name: mariadb
    user: "1001:100"
    restart: always
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - ${MARIADB_DATA_PATH}:/var/lib/mysql
      - ${MARIADB_CUSTOM_CNF_PATH}:/etc/mysql/conf.d/custom.cnf:ro
    ports:
      - "3306:3306"
    networks:
      - mariadb
    security_opt:
      - seccomp=unconfined
    stop_signal: SIGTERM
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: '6.0'
          memory: 700M
        reservations:
          cpus: '3.0'
          memory: 700M

  adminer:
    image: adminer
    user: 1001:100
    container_name: adminer
    restart: no
    ports:
      - 8080:8080
    networks:
      - proxy
      - mariadb
    stop_signal: SIGTERM
    stop_grace_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M
        reservations:
          cpus: '0.05'

  spotweb:
    image: jgeusebroek/spotweb:dev
    container_name: spotweb
    depends_on:
      - db
    environment:
      - PUID=1009
      - PGID=100
      - TZ=Europe/Amsterdam
      - SPOTWEB_DB_TYPE=pdo_mysql
      - SPOTWEB_DB_HOST=${SPOTWEB_DB_HOST}
      - SPOTWEB_DB_PORT=${SPOTWEB_DB_PORT}
      - SPOTWEB_DB_NAME=${SPOTWEB_DB_NAME}
      - SPOTWEB_DB_USER=${SPOTWEB_DB_USER}
      - SPOTWEB_DB_PASS=${SPOTWEB_DB_PASS}
      - SPOTWEB_CRON_RETRIEVE=*/15 * * * *
      - SPOTWEB_CRON_CACHE_CHECK=10 */1 * * *
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.spotweb.rule=Host(`spotweb.damandan.nl`)"
      - "traefik.http.routers.spotweb.entrypoints=websecure"
      - "traefik.http.routers.spotweb.tls=true"
      - "traefik.http.services.spotweb.loadbalancer.server.port=80"
    networks:
      - proxy
    volumes:
      - ${SPOTWEB_CONFIG_PATH}:/config
    tty: true
    stdin_open: true
    stop_signal: SIGTERM
    stop_grace_period: 1m
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'

  sonarr-danny:
    container_name: sonarr-danny
    image: ghcr.io/linuxserver/sonarr
    restart: always
    networks:
      - proxy
    depends_on:
      - sabnzbd
    environment:
      - PUID=1005
      - PGID=100
      - TZ=Europe/Amsterdam
      - UMASK_SET=022
    volumes:
      - ${SONARR_CONFIG_PATH}:/config
      - ${DANNY_SERIES_PATH}:/tv
      - ${DANNY_DOWNLOADS_COMPLETED_PATH}:/downloads
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.damandan.nl`)"
      - "traefik.http.routers.sonarr.entrypoints=websecure"
      - "traefik.http.routers.sonarr.tls=true"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
    stop_signal: SIGTERM
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  bazarr-danny:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr-danny
    restart: always
    networks:
      - proxy
    depends_on:
      - radarr-danny
      - sonarr-danny
    environment:
      - PUID=1007
      - PGID=100
      - TZ=Etc/UTC
    volumes:
      - ${DANNY_BAZARR_CONFIG_PATH}:/config
      - ${DANNY_MOVIES_PATH}:/movies
      - ${DANNY_SERIES_PATH}:/tv
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bazarr.rule=Host(`bazarr.damandan.nl`)"
      - "traefik.http.routers.bazarr.entrypoints=websecure"
      - "traefik.http.routers.bazarr.tls=true"
      - "traefik.http.services.bazarr.loadbalancer.server.port=6767"
    stop_signal: SIGTERM
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  radarr-danny:
    image: ghcr.io/linuxserver/radarr
    container_name: radarr-danny
    restart: always
    networks:
      - proxy
    depends_on:
      - sabnzbd
    environment:
      - PUID=1004
      - PGID=100
      - TZ=Europe/Amsterdam
      - UMASK_SET=022
    volumes:
      - ${DANNY_RADARR_CONFIG_PATH}:/config
      - ${DANNY_MOVIES_PATH}:/movies
      - ${DANNY_DOWNLOADS_COMPLETED_PATH}:/downloads
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.damandan.nl`)"
      - "traefik.http.routers.radarr.entrypoints=websecure"
      - "traefik.http.routers.radarr.tls=true"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
    stop_signal: SIGTERM
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
  
  sabnzbd:
    image: ghcr.io/linuxserver/sabnzbd
    container_name: sabnzbd
    restart: always
    networks:
      - proxy
    environment:
      - PUID=1006
      - PGID=100
      - TZ=Europe/Amsterdam
    volumes:
      - ${DANNY_SABNZBD_CONFIG_PATH}:/config
      - ${DANNY_DOWNLOADS_COMPLETED_PATH}:/config/Downloads/complete/danny
      - ${DANNY_DOWNLOADS_INCOMPLETE_PATH}:/config/Downloads/incomplete/danny
      - ${MARLIE_DOWNLOADS_COMPLETED_PATH}:/config/Downloads/complete/marlie
      - ${MARLIE_DOWNLOADS_INCOMPLETE_PATH}:/config/Downloads/incomplete/marlie
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sabnzbd.rule=Host(`sabnzbd.damandan.nl`)"
      - "traefik.http.routers.sabnzbd.entrypoints=websecure"
      - "traefik.http.routers.sabnzbd.tls=true"
      - "traefik.http.services.sabnzbd.loadbalancer.server.port=9090"
    stop_signal: SIGTERM
    stop_grace_period: 45s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
  
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    # Optional - specify the uid and gid you would like Jellyfin to use instead of root
    user: 1003:100
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.damandan.nl`)"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - "traefik.http.routers.jellyfin.tls=true"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
    networks:
      - proxy
    volumes:
      - ${JELLYFIN_CONFIG_PATH}:/config
      - ${JELLYFIN_CACHE_PATH}:/cache
      - ${PLEX_EPG_FILE_PATH}:/epg/ziggogo.xml
      - type: bind
        source: ${DANNY_SERIES_PATH}
        target: /tv
      - type: bind
        source: ${DANNY_MOVIES_PATH}
        target: /movies
        read_only: true
      - type: bind
        source: ${DANNY_MOVIES_2_PATH}
        target: /movies2
        read_only: true
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - JELLYFIN_PublishedServerUrl=https://jellyfin.damandan.nl
    restart: always
    runtime: nvidia
    # Optional - may be necessary for docker healthcheck to pass if running in host network mode
    extra_hosts:
      - 'host.docker.internal:host-gateway'
  
  steam-headless:
    image: josh5/steam-headless
    container_name: steam-headless
    restart: unless-stopped
    privileged: true
  
    shm_size: "4G"
    ipc: host
  
    networks:
      lan:
        ipv4_address: 192.168.2.29
  
    hostname: SteamHeadless
    extra_hosts:
      - "SteamHeadless:127.0.0.1"
  
    runtime: nvidia
  
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_NICE
  
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
  
    environment:
      # --- Cruciaal: polkit uit ---
      - DISABLE_POLKIT=1
  
      # --- Basis ---
      - TZ=Europe/Amsterdam
      - USER_LOCALES=en_US.UTF-8 UTF-8
      - PUID=1013
      - PGID=100
      - UMASK=000
      - USER_PASSWORD=EPCLSvE8UWSn5TVgCuza6dxP7YwpRi7b
  
      # --- Steam ---
      - ENABLE_STEAM=true
      - STEAM_ARGS=
  
      # --- Sunshine ---
      - ENABLE_SUNSHINE=true
      - SUNSHINE_USER=sunshine
      - SUNSHINE_PASS=j6zeszws498nkdUDwJbnhnKWPXFP2zuv
      - ENABLE_EVDEV_INPUTS=true
  
      # --- Dummy X11 ---
      - FORCE_X11_DUMMY_CONFIG=true
  
      # --- NVIDIA ---
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
  
      - WEB_UI_MODE=vnc
      # --- Belangrijk: GEEN DISPLAY ---
      # --- Belangrijk: GEEN HOST_DBUS ---
  
    devices:
      - /dev/fuse
      - /dev/uinput
  
    device_cgroup_rules:
      - 'c 13:* rmw'
  
    volumes:
      # Correcte dbus mount
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
  
      # Home + games
      - /sharepool/docker-data/steam-headless/home:/home/default:rw
      - /sharepool/docker-data/steam-headless/games:/mnt/games:rw
  
      # Correcte X11 mount
      - /tmp/.X11-unix:/tmp/.X11-unix
  
      # Correcte PulseAudio mount
      - /tmp/pulse:/tmp/pulse
  
    deploy:
      resources:
        limits:
          cpus: '8.0'
          memory: 8G

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    user: 1014:100
    restart: always
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mqtt.rule=Host(`mqtt.damandan.nl`)"
      - "traefik.http.routers.mqtt.entrypoints=websecure"
      - "traefik.http.routers.mqtt.tls=true"
      - "traefik.http.services.mqtt.loadbalancer.server.port=9001"
    volumes:
      - ${MOSQUITTO_CONFIG_PATH}:/mosquitto/config
      - ${MOSQUITTO_DATA_PATH}:/mosquitto/data
      - ${MOSQUITTO_LOG_PATH}:/mosquitto/log
    stop_signal: SIGTERM
    stop_grace_period: 20s

networks:
  networks:
  lan:
    driver: ipvlan
    driver_opts:
      parent: enp5s0
      mode: l2
    ipam:
      config:
        - subnet: 192.168.2.0/24
          gateway: 192.168.2.1
  proxy:
    name: proxy
  mariadb:
    name: mariadb
    driver: bridge

volumes:
  config:
    driver: local
  work:
    driver: local
  open-webui:
  data:
  media:
  pgdata:
  redisdata:
